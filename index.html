<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Mono:wght@400;700&family=Cinzel:wght@700;800&display=swap">
<style>
:root{--bg:#eef2f8;--surface:#fff;--ink:#15203b;--muted:#5d6985;--line:#dde4ee;--band:#f3f6fb;--accent:#2a45d6;--accent-ink:#fff;--bad:#c62828;--c1:#1f9d55;--c1i:#fff;--c2:#f6b800;--c2i:#2a2100;--c3:#2a45d6;--c3i:#fff;--c4:#d62839;--c4i:#fff;--sh:0 1px 2px rgba(21,32,59,.06),0 8px 24px rgba(21,32,59,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1224;--surface:#151d37;--ink:#eef2ff;--muted:#a3adcb;--line:#27314f;--band:#1b2542;--accent:#8fa4ff;--accent-ink:#0c1224;--bad:#ff8a8a;--c1:#4ade80;--c1i:#07210f;--c2:#ffd43b;--c2i:#2a2100;--c3:#8fa4ff;--c3i:#0c1224;--c4:#ff7b86;--c4i:#33060b;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c1224;--surface:#151d37;--ink:#eef2ff;--muted:#a3adcb;--line:#27314f;--band:#1b2542;--accent:#8fa4ff;--accent-ink:#0c1224;--bad:#ff8a8a;--c1:#4ade80;--c1i:#07210f;--c2:#ffd43b;--c2i:#2a2100;--c3:#8fa4ff;--c3i:#0c1224;--c4:#ff7b86;--c4i:#33060b;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
.f-first{--fc:var(--c1);--fi:var(--c1i)}.f-second{--fc:var(--c2);--fi:var(--c2i)}.f-third{--fc:var(--c3);--fi:var(--c3i)}.f-fourth{--fc:var(--c4);--fi:var(--c4i)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:52rem;margin:0 auto;padding:2.5rem 1rem 3rem}
h1,.class b,.big{font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.08;margin:0 0 .6rem}
.wrap[class*="f-"] h1::before{content:"";display:block;width:3rem;height:.4rem;border-radius:4px;background:var(--fc);margin-bottom:.8rem}
.lede{margin:0 0 1.75rem;color:var(--muted);max-width:52ch}
[hidden]{display:none!important}
.classes{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.class{position:relative;overflow:hidden;display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.25rem;cursor:pointer;font:inherit;box-shadow:var(--sh);transition:transform .15s}
.class:hover{transform:translateY(-3px)}
.class b{display:block;font-size:1.35rem;margin-bottom:.2rem}
.class span{color:var(--muted);font-size:.95rem}
.wrap[class*="f-"] .class{border-left:8px solid var(--fc)}
.class.form{min-height:9.5rem;background:var(--fc);color:var(--fi);border:0;padding:1.4rem}
.class.form b{font-size:1.6rem;position:relative;z-index:1}
.class.form::after{position:absolute;right:1rem;bottom:-1rem;font-size:7.5rem;font-weight:800;line-height:1;opacity:.22}
.f-first.form::after{content:"1"}.f-second.form::after{content:"2"}.f-third.form::after{content:"3"}.f-fourth.form::after{content:"4"}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{display:inline-flex;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;font:inherit;font-weight:600;cursor:pointer;margin-bottom:1.25rem;box-shadow:var(--sh)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 3.5rem 6.5rem 4.75rem;gap:.5rem;align-items:center;padding:.4rem 1.1rem}
.cols{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:.9rem}
.cols span:nth-child(n+2),.pts{text-align:right}
.tier{display:flex;align-items:center;background:var(--band);padding:.45rem 1.1rem;font-weight:700;font-size:.95rem;margin-top:.5rem}
.tier::before{content:"";flex:none;width:.65rem;height:.65rem;border-radius:50%;background:var(--fc,var(--accent));margin-right:.6rem}
.tier small{font-weight:400;color:var(--muted);margin-left:.5rem}
label{font-weight:600}
.hrs{text-align:right;color:var(--muted)}
input{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--band);border:1.5px solid var(--line);border-radius:10px;padding:.45rem .6rem;min-height:2.6rem;text-align:right}
input::placeholder{color:var(--muted);opacity:.7}
input:focus{border-color:var(--accent)}
input[aria-invalid="true"]{border-color:var(--bad)}
.pts{font-weight:600;font-variant-numeric:tabular-nums}
.foot{border-top:1px solid var(--line);padding:1.1rem}
.foot dl{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;margin:0 0 1rem}
.foot dt{color:var(--muted)}.foot dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.final{background:var(--fc,var(--accent));color:var(--fi,var(--accent-ink));border-radius:16px;padding:1rem 1.25rem;font-weight:700}
.final .big{display:block;font-size:clamp(3rem,11vw,4.25rem);line-height:1.05;margin-top:.15rem}
#msg{margin:.4rem 0 0;font-weight:400}
#err{margin:.5rem 0 0;background:var(--surface);color:var(--bad);padding:.4rem .7rem;border-radius:8px}
.mist{margin:.25rem 0 0;font-weight:400;font-size:.9rem;opacity:.85}
.btn{background:none;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;margin-top:1rem}
@media(max-width:30rem){.cols,.row{grid-template-columns:minmax(0,1fr) 2rem 5.25rem 4.25rem;gap:.3rem;padding-left:.75rem;padding-right:.75rem}.tier{padding-left:.75rem}}

/* edgy + motion layer */
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.35;pointer-events:none;background-image:linear-gradient(135deg,var(--line) 25%,transparent 25% 50%,var(--line) 50% 75%,transparent 75%);background-size:40px 40px;animation:drift 14s linear infinite}
@keyframes drift{to{background-position:40px 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.88);opacity:.3}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes shine{to{left:140%}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
@keyframes stripes{to{background-position:56px 0}}
.cols,.tier,.hrs,.pts,.class span,.foot dd,.big,.mist{font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
h1{text-transform:uppercase;letter-spacing:-.01em}
h1::after{content:"_";margin-left:.1em;animation:blink 1s steps(2) infinite}
section:not([hidden]){animation:rise .45s backwards}
.classes>*{animation:rise .5s backwards}
.classes>:nth-child(2){animation-delay:.08s}.classes>:nth-child(3){animation-delay:.16s}.classes>:nth-child(4){animation-delay:.24s}.classes>:nth-child(5){animation-delay:.32s}.classes>:nth-child(6){animation-delay:.4s}
.class{border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.class:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.class:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.class.form{border:2px solid var(--ink)}
.class.form:nth-child(odd){transform:rotate(-1deg)}.class.form:nth-child(even){transform:rotate(1deg)}
.class.form:hover{transform:translate(-3px,-3px) rotate(0)}
.class.form::after{animation:float 5s ease-in-out infinite}
.class.form::before{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);pointer-events:none}
.class.form:hover::before{animation:shine .7s}
.wrap[class*="f-"] .class{border-left:10px solid var(--fc)}
.back,.btn{border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-transform:uppercase;font-size:.8rem;letter-spacing:.06em}
.back:hover,.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.back:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card{border:2px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--fc,var(--accent))}
.cols{text-transform:uppercase}
.tier{text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.tier::before{border-radius:0;animation:pulse 2s ease-in-out infinite}
#rows>*{animation:rise .45s backwards}
input{border:2px solid var(--line);border-radius:4px}
input:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--fc,var(--accent));outline:none}
.final{position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:4px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 14px,transparent 14px 28px);background-size:56px 56px;animation:stripes 3s linear infinite}
.final::before{content:"";position:absolute;top:1rem;right:1rem;width:.65rem;height:.65rem;background:currentColor;animation:blink 1.2s steps(2) infinite}
.final .big{animation:pop .4s}
.foot{border-top:2px solid var(--ink)}
input[type=number]{-moz-appearance:textfield;appearance:textfield;padding-left:.4rem;padding-right:.4rem}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.class.has-stk{padding-right:4.8rem}
.stk{position:absolute;top:.8rem;right:.8rem;width:3rem;height:3rem;display:grid;place-items:center;font-style:normal;font-size:1.7rem;line-height:1;background:var(--surface);border:2px solid var(--ink);border-radius:10px;box-shadow:2px 2px 0 var(--ink);transform:rotate(8deg)}
.class:nth-child(even) .stk{transform:rotate(-8deg)}
.class:hover .stk{animation:wiggle .6s}
@keyframes wiggle{0%,100%{transform:rotate(8deg) scale(1)}30%{transform:rotate(-12deg) scale(1.18)}60%{transform:rotate(12deg) scale(1.18)}}
@media(max-width:30rem){label{font-size:.88rem;overflow-wrap:anywhere}}
.btn+.btn{margin-left:.6rem}
.an{margin-top:1.25rem;border:2px solid var(--ink);border-radius:4px;padding:1rem 1.1rem;background:var(--band);animation:rise .35s backwards}
.an h2{margin:0 0 .3rem;font-size:1.25rem;text-transform:uppercase}
.ansub{margin:0 0 .9rem;color:var(--muted);font-size:.95rem}
.ai{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.75rem;align-items:center;padding:.65rem 0;border-top:2px dashed var(--line)}
.rk{width:2rem;height:2rem;display:grid;place-items:center;background:var(--bad);color:var(--surface);font-weight:800;font-family:"Space Mono",ui-monospace,monospace;border-radius:4px}
.nm b{display:block}
.nm small,.dg small{display:block;color:var(--muted);font-size:.8rem;font-family:"Space Mono",ui-monospace,monospace}
.dg{text-align:right}
.dg em{font-style:normal;font-weight:800;font-size:1.35rem;color:var(--bad);font-family:"Space Mono",ui-monospace,monospace}
.honor{margin-top:1rem;text-align:center;padding:1rem;border:2px solid #f6b800;border-radius:4px;background:rgba(246,184,0,.14);box-shadow:0 0 18px 4px rgba(246,184,0,.55);animation:pop .45s,glow 2.2s ease-in-out infinite}
.hr-t{font-size:clamp(1.8rem,8vw,2.7rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.hr-s{margin-top:.3rem;font-size:.9rem;font-family:"Space Mono",ui-monospace,monospace}
@keyframes glow{50%{box-shadow:0 0 28px 8px rgba(246,184,0,.85)}}
.honor{background:linear-gradient(135deg,#14100a,#2f2408 55%,#14100a);border:2px solid #e8b923;box-shadow:0 0 18px 4px rgba(246,184,0,.55),inset 0 0 0 3px rgba(246,200,60,.25)}
.hr-t{font-family:"UnifrakturCook","Old English Text MT","Palatino Linotype",Georgia,serif;font-weight:700;text-transform:none;letter-spacing:.02em;font-size:clamp(2.2rem,10vw,3.4rem);color:#f6c000;background-image:linear-gradient(100deg,#b8860b 0%,#ffe27a 25%,#f6c000 45%,#fff4b8 55%,#c9930a 75%,#b8860b 100%);background-size:300px 100%;background-repeat:repeat-x;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gold 4s linear infinite}
.hr-s{color:#f3d36a;font-size:.95rem;margin-top:.2rem}
.hr-m{margin-top:.5rem;display:inline-block;color:#f3d36a;border:1.5px solid #e8b923;padding:.1rem .6rem;font-family:"Space Mono",ui-monospace,monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
@keyframes gold{to{background-position:300px 0}}
.hr-t{font-family:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.6rem,7.5vw,2.8rem);color:#fff;background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#fff;text-shadow:0 0 14px rgba(255,214,64,.75);animation:tglow 2.2s ease-in-out infinite}
.hr-s{color:#ffd84d}
.hr-m{color:#ffd84d;border-color:#ffd84d}
@keyframes tglow{50%{text-shadow:0 0 24px rgba(255,214,64,1)}}
html,body{overflow-x:hidden}
#home{position:relative}
#home h1,#home .lede{position:relative;z-index:1;max-width:min(100% - 4rem,34rem)}
.kicker{position:relative;z-index:1;display:inline-block;margin-bottom:.9rem;padding:.25rem .7rem;border:2px solid var(--ink);background:var(--c2);color:var(--c2i);font:700 .75rem "Space Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.decor{position:absolute;inset:0;pointer-events:none;user-select:none}
.decor span{position:absolute;line-height:1;animation:float 6s ease-in-out infinite}
.decor span:nth-of-type(1){top:.2rem;right:.3rem;font-size:3rem}
.decor span:nth-of-type(2){top:5rem;right:3.5rem;font-size:2rem;animation-delay:-1.5s}
.decor span:nth-of-type(3){top:1rem;right:9.5rem;font-size:2.2rem;animation-delay:-3s}
.decor span:nth-of-type(4){top:7.5rem;right:8rem;font-size:1.6rem;animation-delay:-4s}
.shp{position:absolute}
.s1{top:-.6rem;right:6rem;width:3.2rem;height:3.2rem;border:3px solid var(--c3);border-radius:50%;animation:float 7s ease-in-out infinite}
.s2{top:6.5rem;right:.2rem;width:2.4rem;height:2.4rem;background:var(--c4);transform:rotate(15deg);animation:float 5s ease-in-out infinite -2s}
.s3{top:3rem;right:12rem;width:0;height:0;border-left:1rem solid transparent;border-right:1rem solid transparent;border-bottom:1.8rem solid var(--c1);animation:float 6s ease-in-out infinite -3s}
.ticker{margin:0 -1rem 1.75rem;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--ink);color:var(--surface);overflow:hidden;white-space:nowrap;transform:rotate(-1deg)}
.track{display:inline-block;padding:.45rem 0;animation:marq 24s linear infinite;font:700 .8rem "Space Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.track span{padding-right:2rem}
@keyframes marq{to{transform:translateX(-50%)}}
.steps{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));margin-top:2.5rem}
.steps>div{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:2px dashed var(--ink);border-radius:4px;background:var(--surface);animation:rise .5s backwards}
.steps>div:nth-child(2){animation-delay:.1s}.steps>div:nth-child(3){animation-delay:.2s}
.steps b{flex:none;width:2.2rem;height:2.2rem;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:700 1rem "Space Mono",ui-monospace,monospace;border-radius:4px}
.steps>div:nth-child(1) b{background:var(--c1);color:var(--c1i)}.steps>div:nth-child(2) b{background:var(--c2);color:var(--c2i)}.steps>div:nth-child(3) b{background:var(--c3);color:var(--c3i)}
.steps span{font-weight:600}
.foot2{margin:1.25rem 0 0;color:var(--muted);font:400 .85rem "Space Mono",ui-monospace,monospace}
@media(max-width:30rem){.decor span:nth-of-type(n+3),.s1,.s3{display:none}.decor span:nth-of-type(1){font-size:2.4rem}.decor span:nth-of-type(2){right:2.6rem}}
.honor.top .hr-t{font-size:clamp(1.3rem,5.5vw,2rem);line-height:1.2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <div class="decor" aria-hidden="true"><i class="shp s1"></i><i class="shp s2"></i><i class="shp s3"></i><span>🎓</span><span>✏️</span><span>📚</span><span>⭐</span></div>
    <div class="kicker">Report card tool</div>
    <h1>Final average calculator</h1>
    <p class="lede">Choose your form to get started.</p>
    
    <div class="classes" id="forms"></div>
    
    
  </section>

  <section id="formpg" hidden>
    <button class="back" id="backhome" type="button">Back to forms</button>
    <h1 id="ftitle"></h1>
    <p class="lede" id="fnote"></p>
    <div class="classes" id="classes"></div>
  </section>

  <section id="cls" hidden>
    <button class="back" id="back" type="button">Back to classes</button>
    <h1 id="title"></h1>
    <p class="lede" id="lede2"></p>
    <div class="card">
      <div class="cols" aria-hidden="true"><span>Subject</span><span>Hrs</span><span>Grade</span><span>Points</span></div>
      <div id="rows"></div>
      <div class="foot">
        <dl>
          <dt>Total credit hours</dt><dd id="hrs"></dd>
          <dt>Total points</dt><dd id="tp">0.00</dd>
        </dl>
        <div class="final" aria-live="polite">
          <div>Final average</div>
          <div id="fa"><span class="big">&ndash;</span></div>
          <p id="msg"></p>
          <p id="err" role="alert" hidden></p>
          
        </div>
        <div class="honor" id="honor" hidden><div class="hr-t">Honor Roll</div><div class="hr-s">Keep up the good work!</div><div class="hr-m">85% or more</div></div>
        <div class="honor top" id="top10" hidden><div class="hr-t">Top 10 overall status</div><div class="hr-s">*mistakes are very possible.</div></div>
        <button class="btn" id="clear" type="button">Clear all grades</button>
        <button class="btn" id="anbtn" type="button" aria-expanded="false" aria-controls="an">View analytics</button>
        <div class="an" id="an" hidden>
          <h2>Performance details</h2>
          <p class="ansub" id="ansub"></p>
          <div id="anlist"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
(function(){
function T(m,s,r,si){return [{name:"Majors",cr:4,subs:m},{name:"Sub-majors",cr:3,subs:s},{name:"Regulars",cr:2,subs:r},{name:"Singles",cr:1,subs:si}];}
var REG=["Spanish","Belizean Studies","Entrepreneurship"];
var CL=[
 {id:"ict",name:"ICT",tiers:T(["Programming","MIC","English","Math"],["Physics"],["Networking"].concat(REG),["Literature","LSK","PE"])},
 {id:"science",name:"Science",tiers:T(["Chemistry","English","Math"],["I.T","Biology","Physics"],REG,["Literature","LSK","PE"])},
 {id:"arts",name:"Arts",tiers:T(["History","English","Math"],["Literature","HSB","I.T"],REG.concat(["PE"]),["LSK"])},
 {id:"business",name:"Business",tiers:T(["POA","English","Math"],["HSB","POB","I.T"],REG,["Literature","LSK","PE"])},
 {id:"tourism",name:"Tourism",tiers:T(["FPH","English","Math"],["RST","HSB","I.T"],REG,["Literature","LSK","PE"])},
 {id:"industrial",name:"Industrial",tiers:T(["Elec.","English","Math"],["T.D","Bldg","I.T"],REG,["Literature","LSK","PE"])},
 {id:"general",name:"General",tiers:T(["Agric","English","Math"],["POB","HSB","I.T"],REG,["Literature","LSK","PE"])}
];
CL.forEach(function(c){c.n=0;c.hrs=0;c.tiers.forEach(function(t){c.n+=t.subs.length;c.hrs+=t.subs.length*t.cr;});});
function $(id){return document.getElementById(id);}
var cur=null,g={},cells=[];
CL.forEach(function(c){
  var b=document.createElement("button");b.type="button";b.className="class has-stk";
  b.innerHTML='<i class="stk" aria-hidden="true">'+({ict:"💻",science:"🔬",arts:"📖",business:"💼",tourism:"🌴",industrial:"🔧",general:"🌱"})[c.id]+"</i><b>"+c.name+"</b><span>"+c.n+" subjects, "+c.hrs+" credit hours</span>";
  b.addEventListener("click",function(){location.hash=curF+"-"+c.id;});
  $("classes").appendChild(b);
});
var FORMS=[{id:"first",name:"First Form"},{id:"second",name:"Second Form"},{id:"third",name:"Third Form"},{id:"fourth",name:"Fourth Form"}];
FORMS.forEach(function(f){var b=document.createElement("button");b.type="button";b.className="class form f-"+f.id;b.innerHTML="<b>"+f.name+"</b>";b.addEventListener("click",function(){location.hash=f.id;});$("forms").appendChild(b);});
var FIRST={id:"first",name:"First Form",tiers:T(["Math","English"],["Science","Belizean Studies"],["Religion","Spanish","Agriculture","PE","Literature","LSK","C.Arts"],["Keyboarding"]).concat([{name:"Club",cr:0,subs:["Club"]}])};
var SECOND={id:"second",name:"Second Form",tiers:T(["Math","English"],["Science","Belizean Studies"],["Religion","Spanish","Agriculture","PE","Literature","LSK","E.Arts"],["Keyboarding"]).concat([{name:"Club",cr:0,subs:["Club"]}])};
var DIRECT={first:FIRST,second:SECOND},curF="";
[FIRST,SECOND].forEach(function(x){x.n=0;x.hrs=0;x.tiers.forEach(function(t){x.n+=t.subs.length;x.hrs+=t.subs.length*t.cr;});});
function keyOf(c){return curF==="fourth"?"report-grades-fourth-"+c.id:(c.id==="ict"?"ict-report-grades":"report-grades-"+c.id);}
function save(){try{localStorage.setItem(keyOf(cur),JSON.stringify(g));}catch(e){}}
function fmt(n,d){return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);}
function fmt6(n){var t=Math.floor(n*1000+1e-7),b=Math.floor(t/10);if(t%10>=6)b+=1;return (b/100).toFixed(2);}
function renderAn(){
  var box=$("an");if(box.hidden||!cur)return;
  var low=[],have=0;
  cells.forEach(function(c){var v=parseFloat(c.i.value);if(c.cr>0&&!isNaN(v)&&v>=0&&v<=100){have++;if(v<60)low.push({s:c.s,v:v,cr:c.cr,d:(60-v)*c.cr/cur.hrs});}});
  low.sort(function(a,b){return b.d-a.d;});
  var sub=$("ansub"),list=$("anlist");list.innerHTML="";
  if(!have){sub.textContent="Enter some grades first, then check back here.";return;}
  if(!low.length){sub.textContent="No subjects are under 60. Nothing is dragging your average down.";return;}
  sub.textContent="Subjects that bring down your average the most. (subjects under 60)";
  low.forEach(function(x,i){
    var d=document.createElement("div");d.className="ai";
    d.innerHTML='<span class="rk">'+(i+1)+'</span><div class="nm"><b></b><small></small></div><div class="dg"><em></em><small>off your average</small></div>';
    d.querySelector("b").textContent=x.s;
    d.querySelector("small").textContent="Subject grade: "+fmt(x.v,2)+"% \u00b7 "+x.cr+" credit hrs";
    d.querySelector("em").textContent="\u2212"+fmt(x.d,2)+"%";
    list.appendChild(d);
  });
}
function openClass(c){
  cur=c;g={};$("an").hidden=true;$("anbtn").textContent="View analytics";$("anbtn").setAttribute("aria-expanded","false");
  try{g=JSON.parse(localStorage.getItem(keyOf(c))||"{}")||{};}catch(e){g={};}
  var fm=FORMS.filter(function(x){return x.id===curF;})[0];$("title").textContent=(fm&&c.id!==curF?fm.name+" ":"")+c.name+" progress report";
  $("lede2").textContent="Enter each grade as a percentage from 0 to 100. Each grade is multiplied by its credit hours, then the total is divided by "+c.hrs+".";
  $("hrs").textContent=c.hrs;
  var rows=$("rows"),k=0;rows.innerHTML="";cells=[];
  c.tiers.forEach(function(t){
    var h=document.createElement("div");h.className="tier";
    h.innerHTML=t.name+"<small>"+t.cr+" credit hour"+(t.cr===1?"":"s")+" each</small>";
    rows.appendChild(h);
    t.subs.forEach(function(s){
      var r=document.createElement("div");r.className="row";
      var n=document.createElement("label");n.textContent=s;
      var hr=document.createElement("span");hr.className="hrs";hr.textContent=t.cr;
      var i=document.createElement("input");i.type="number";i.inputMode="decimal";i.step="any";i.min="0";i.max="100";i.placeholder="0\u2013100";i.value=g[s]||"";
      i.id="g"+(k++);n.htmlFor=i.id;
      var p=document.createElement("span");p.className="pts";
      i.addEventListener("input",function(){g[s]=i.value;save();calc();});
      r.appendChild(n);r.appendChild(hr);r.appendChild(i);r.appendChild(p);rows.appendChild(r);
      cells.push({s:s,cr:t.cr,i:i,p:p});
    });
  });
  calc();
}
function calc(){
  var tp=0,done=0,bad=0;
  cells.forEach(function(c){
    var raw=c.i.value.trim(),v=parseFloat(raw);
    var ok=raw!==""&&!isNaN(v)&&v>=0&&v<=100;
    c.i.setAttribute("aria-invalid",raw!==""&&!ok?"true":"false");
    if(raw!==""&&!ok)bad++;
    if(ok){if(c.cr>0)done++;tp+=v*c.cr;c.p.textContent=fmt(v*c.cr,2);}else{c.p.textContent="";}
  });
  $("tp").textContent=fmt(tp,2);renderAn();
  var fa=$("fa"),msg=$("msg"),err=$("err");
  err.hidden=!bad;err.textContent=bad?"Grades must be a number from 0 to 100.":"";
  var need=cells.filter(function(c){return c.cr>0;}).length;
  if(done===need){
    var fv=fmt6(tp/cur.hrs);fa.innerHTML='<span class="big">'+fv+'%</span>';$("honor").hidden=parseFloat(fv)<85;$("top10").hidden=parseFloat(fv)<94.18;
    msg.textContent="Total points "+fmt(tp,2)+" divided by "+cur.hrs+" credit hours.";
  }else{
    fa.innerHTML='<span class="big">&ndash;</span>';$("honor").hidden=true;$("top10").hidden=true;
    var left=need-done;
    msg.textContent="Enter "+left+" more grade"+(left>1?"s":"")+" to see the final average.";
  }
}
function route(){
  var id=location.hash.slice(1),parts=id.split("-"),f=FORMS.filter(function(x){return x.id===parts[0];})[0],c=f&&parts[1]?CL.filter(function(x){return x.id===parts[1];})[0]:null;if(c&&f.id!=="third"&&f.id!=="fourth")c=null;if(f&&DIRECT[f.id])c=DIRECT[f.id];curF=f?f.id:"";
  $("home").hidden=!!f;$("formpg").hidden=!f||!!c;$("cls").hidden=!c;document.querySelector(".wrap").className=f?"wrap f-"+f.id:"wrap";$("back").textContent=c&&DIRECT[c.id]?"Back to forms":"Back to classes";
  if(f&&!c){$("ftitle").textContent=f.name;var ok=f.id==="third"||f.id==="fourth";$("classes").hidden=!ok;$("fnote").textContent=ok?"Choose a class to enter grades and work out the final average for the progress report.":"No classes have been added to this form yet.";}
  if(c)openClass(c);
  window.scrollTo(0,0);
}
$("back").addEventListener("click",function(){location.hash=DIRECT[curF]?"":curF;});
$("backhome").addEventListener("click",function(){location.hash="";});
$("anbtn").addEventListener("click",function(){var b=$("an");b.hidden=!b.hidden;this.textContent=b.hidden?"View analytics":"Hide analytics";this.setAttribute("aria-expanded",String(!b.hidden));renderAn();});
$("clear").addEventListener("click",function(){g={};save();cells.forEach(function(c){c.i.value="";});calc();});
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
</html>
